name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 24 / PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: idosi_ci
          POSTGRES_PASSWORD: idosi_ci_password
          POSTGRES_USER: idosi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idosi_ci -d idosi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      API_HOST: 127.0.0.1
      API_PORT: 3000
      CI: 'true'
      DATABASE_URL: postgresql://idosi_ci:idosi_ci_password@127.0.0.1:5432/idosi_ci
      NODE_ENV: test
      RUN_POSTGRES_TESTS: '1'
      TZ: Asia/Ho_Chi_Minh
      VITE_API_BASE_URL: /api/v1
      VITE_ENABLE_MOCK_FALLBACK: 'false'
      WEB_ORIGIN: http://127.0.0.1:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report toolchain
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all production artifacts
        run: npm run build

      - name: Apply migrations to a fresh PostgreSQL database
        run: node infra/scripts/run-migrations.mjs

      - name: Verify migrations are repeatable
        run: node infra/scripts/run-migrations.mjs

      - name: Seed reference data twice to verify reconciliation is idempotent
        run: |
          npm run seed:production -w @idosi/database
          npm run seed:production -w @idosi/database

      - name: Verify one-shot administrator bootstrap
        env:
          BOOTSTRAP_ADMIN_DISPLAY_NAME: CI Administrator
          BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password-not-for-production
          BOOTSTRAP_ADMIN_USERNAME: ci.admin
        run: npm run bootstrap-admin:production -w @idosi/api

      - name: Run all workspace tests
        run: npm run test

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run responsive browser smoke tests
        run: npm run e2e

      - name: Run production sorting browser test
        run: npm run e2e:production -w @idosi/web

      - name: Run live browser workflows against API and PostgreSQL
        env:
          LIVE_E2E_ADMIN_PASSWORD: ci-bootstrap-password-not-for-production
          LIVE_E2E_ADMIN_USERNAME: ci.admin
          LIVE_E2E_RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run e2e:live

      - name: Validate infrastructure sources
        env:
          APP_DOMAIN: localhost
          IMAGE_PREFIX: local/khohang-idosi
          IMAGE_TAG: 0000000000000000000000000000000000000000
          POSTGRES_PASSWORD: idosi_ci_password
        run: |
          bash -n infra/scripts/backup-db.sh
          bash -n infra/scripts/restore-db.sh
          bash -n infra/scripts/rollback.sh
          bash -n infra/scripts/deploy.sh
          bash -n infra/autodeploy/khohang-autodeploy.sh
          bash -n infra/autodeploy/install.sh
          bash -n infra/scripts/prune-backups.sh
          bash -n infra/backup/khohang-backup.sh
          bash infra/scripts/tests/deployment-scripts.test.sh
          bash infra/scripts/tests/autodeploy.test.sh
          node --check infra/scripts/run-migrations.mjs
          node infra/scripts/check-migration-safety.mjs
          node --test infra/scripts/check-migration-safety.test.mjs
          node --check infra/web-server.mjs
          node --test infra/web-server.test.mjs
          docker compose --file docker-compose.yml config --quiet
          docker compose --file docker-compose.yml config --format json | node --input-type=module -e '
            import assert from "node:assert/strict";
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const config = JSON.parse(input);
            assert.ok(Object.keys(config.services.worker.networks).some(name => !config.networks[name].internal), "worker requires external HTTPS egress");
            assert.ok(Object.keys(config.services.db.networks).every(name => config.networks[name].internal), "database must remain internal");
            assert.ok(!config.services.db.ports?.length, "database must not publish ports");
            assert.equal(config.services.api.environment.IDOSI_STORE_ID_MAP, config.services.worker.environment.IDOSI_STORE_ID_MAP);
            assert.equal(config.services.caddy.user, "65532:65532");
            assert.deepEqual(config.services.caddy.cap_drop, ["ALL"]);
            assert.deepEqual(config.services.caddy.cap_add, ["NET_BIND_SERVICE"]);
            assert.ok(config.services.caddy.security_opt.includes("no-new-privileges:true"));
          '
          docker compose --file docker-compose.yml run --rm --no-deps caddy-storage-init
          docker compose --file docker-compose.yml run --rm --no-deps caddy caddy version
          docker compose --file docker-compose.yml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build production containers from a restrictive deployment checkout
        env:
          APP_DOMAIN: localhost
          IMAGE_PREFIX: local/khohang-idosi
          IMAGE_TAG: 0000000000000000000000000000000000000000
          POSTGRES_PASSWORD: idosi_ci_password
        run: |
          set -euo pipefail
          build_context="$(mktemp -d)"
          trap 'git worktree remove --force "$build_context"' EXIT
          (
            umask 077
            git worktree add --detach "$build_context" HEAD
          )
          # Reproduce the root-owned 0600/0700 inputs created by the VPS watcher.
          # Docker COPY owns these files as root even when CI runs as runner.
          test "$(stat -c %a "$build_context/package.json")" = 600
          test "$(stat -c %a "$build_context/packages/database")" = 700
          python3 "$build_context/infra/scripts/normalize-release-permissions.py"
          test "$(stat -c %a "$build_context/package.json")" = 644
          test "$(stat -c %a "$build_context/Caddyfile")" = 644
          test "$(stat -c %a "$build_context/packages/database")" = 755
          docker compose --file "$build_context/docker-compose.yml" build api migrate worker web

      - name: Verify production migration, bootstrap, and healthy full stack
        env:
          APP_DOMAIN: localhost
          BOOTSTRAP_ADMIN_DISPLAY_NAME: CI Container Administrator
          BOOTSTRAP_ADMIN_PASSWORD: ci-container-bootstrap-password
          BOOTSTRAP_ADMIN_USERNAME: ci.container.admin
          DATABASE_URL: postgresql://idosi:idosi_ci_password@db:5432/idosi
          IMAGE_PREFIX: local/khohang-idosi
          IMAGE_TAG: 0000000000000000000000000000000000000000
          POSTGRES_PASSWORD: idosi_ci_password
        run: |
          set -euo pipefail
          cleanup() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              docker compose --file docker-compose.yml ps --all || true
              docker compose --file docker-compose.yml logs --no-color --tail 100 worker api migrate || true
            fi
            docker compose --file docker-compose.yml down --volumes --remove-orphans
            exit "$status"
          }
          trap cleanup EXIT

          docker compose --file docker-compose.yml up --detach --pull missing --wait db
          docker compose --file docker-compose.yml run --rm --no-deps --pull never migrate
          docker compose --file docker-compose.yml run --rm --no-deps --pull never migrate
          docker compose --file docker-compose.yml --profile bootstrap run --rm --no-deps --pull never bootstrap-admin
          docker compose --file docker-compose.yml up --detach --pull never --wait --wait-timeout 120 api worker web caddy
          # localhost uses Caddy's internal CA in this isolated CI stack only.
          curl --fail --silent --show-error --insecure https://localhost/health
          curl --fail --silent --show-error --insecure https://localhost/ready
          curl --fail --silent --show-error --insecure https://localhost/ >/dev/null
