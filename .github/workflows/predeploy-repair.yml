name: Prepare pending release repairs

on:
  push:
    branches:
      - chore/predeploy-wholesale-20260922
    paths:
      - .github/workflows/predeploy-repair.yml

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'mrbengilo/KHOHANG-IDOSI' && github.ref == 'refs/heads/chore/predeploy-wholesale-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out only the isolated repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed source repairs with exact-match guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, before, after):
              if text.count(before) != 1:
                  raise SystemExit('Source changed: expected exactly one match for ' + repr(before[:100]))
              return text.replace(before, after, 1)

          path = Path('apps/api/src/postgres-repository.ts')
          text = path.read_text()
          start = text.index('  public async listPartnerReceipts(')
          end = text.index('  private async orderSessionById(', start)
          block = text[start:end]
          block = replace_once(block, '      status: query.status,\n      partnerName: query.partnerName,', "      ...(query.status === undefined ? {} : { status: query.status }),\n      ...(query.partnerName === undefined ? {} : { partnerName: query.partnerName }),")
          block = replace_once(block, '      data: result.data,', '      data: [...result.data],')
          block = replace_once(block, '    context: RequestContext,', '    _context: RequestContext,')
          path.write_text(text[:start] + block + text[end:])

          path = Path('packages/database/src/partner-receipt-operations.ts')
          text = path.read_text()
          for unused in ['  CreatePartnerReceiptRequest,\n', '  ListPartnerReceiptsQuery,\n', '  type JsonObject,\n', "import type { Transaction } from './transaction.js';\n"]:
              text = replace_once(text, unused, '')
          text = replace_once(text, 'input.status.toLowerCase() as any', "input.status.toLowerCase() as 'draft' | 'confirmed' | 'cancelled'")
          path.write_text(text)

          path = Path('apps/web/src/lib/api.ts')
          text = replace_once(path.read_text(), 'async function request(path: string, init?: RequestInit): Promise<unknown> {', 'export async function request(path: string, init?: RequestInit): Promise<unknown> {')
          path.write_text(text)

          path = Path('apps/web/src/features/partner-receipts/PartnerReceiptsPage.tsx')
          text = path.read_text()
          text = replace_once(text, "import { useOutletContext } from 'react-router-dom';\n", '')
          text = replace_once(text, "import type { AppOutletContext } from '../../components/AppShell';\n", '')
          text = replace_once(text, "import { listCatalog, type CatalogProduct } from '../../lib/api';", "import { listCatalog } from '../../lib/api';\nimport type { ProductConversion as CatalogProduct } from '../../lib/types';")
          text = replace_once(text, '  const { session } = useOutletContext<AppOutletContext>();\n  const { principal } = useSession();', '  const sessionQuery = useSession();\n  const principal = sessionQuery.data?.principal;')
          text = replace_once(text, "    queryKey: ['partner-receipts', principal.storeId],", "    queryKey: ['partner-receipts', principal?.accountId, principal?.storeId],")
          text = replace_once(text, '    queryFn: () =>\n      listPartnerReceipts({\n        storeId: principal.storeId!,\n        page: 1,\n        pageSize: 50,\n      }),\n    enabled: principal.role === \'STORE\' && !!principal.storeId,', "    queryFn: () => {\n      if (!principal?.storeId) throw new Error('Phiên đăng nhập không có cửa hàng');\n      return listPartnerReceipts({ storeId: principal.storeId, page: 1, pageSize: 50 });\n    },\n    enabled: principal?.role === 'STORE' && !!principal.storeId,")
          text = replace_once(text, '    queryFn: () => listCatalog(),', "    queryFn: () => listCatalog(),\n    enabled: principal?.role === 'STORE' && !!principal.storeId,")
          text = replace_once(text, "    const newLines = [...lines];\n    newLines[index] = { ...newLines[index], [field]: value };\n    setLines(newLines);", "    setLines((current) =>\n      current.map((line, currentIndex) =>\n        currentIndex === index ? { ...line, [field]: value } : line,\n      ),\n    );")
          text = replace_once(text, '    if (!principal.storeId) return;', '    if (!principal?.storeId) return;')
          text = replace_once(text, "  if (principal.role !== 'STORE' || !principal.storeId) {", "  if (sessionQuery.isLoading) return <DashboardSkeleton />;\n\n  if (principal?.role !== 'STORE' || !principal.storeId) {")
          text = replace_once(text, "  const receipts = receiptsQuery.data?.data ?? [];", "  if (receiptsQuery.isError || productsQuery.isError) {\n    const error = receiptsQuery.error ?? productsQuery.error;\n    return <div role=\"alert\">{error instanceof Error ? error.message : 'Không tải được dữ liệu'}</div>;\n  }\n\n  const receipts = receiptsQuery.data?.data ?? [];")
          path.write_text(text)

          Path('apps/web/src/features/partner-receipts/partnerReceiptsApi.ts').write_text('''import {
            CreatePartnerReceiptRequestSchema,
            CreatePartnerReceiptResponseSchema,
            GetPartnerReceiptResponseSchema,
            ListPartnerReceiptsResponseSchema,
            PartnerReceiptParamsSchema,
            type CreatePartnerReceiptRequest,
            type CreatePartnerReceiptResponse,
            type ListPartnerReceiptsQuery,
            type ListPartnerReceiptsResponse,
            type GetPartnerReceiptResponse,
          } from '@idosi/contracts';
          import { request } from '../../lib/api';

          export async function listPartnerReceipts(
            query: ListPartnerReceiptsQuery,
          ): Promise<ListPartnerReceiptsResponse> {
            const params = new URLSearchParams();
            if (query.page !== undefined) params.set('page', String(query.page));
            if (query.pageSize !== undefined) params.set('pageSize', String(query.pageSize));
            if (query.storeId) params.set('storeId', query.storeId);
            if (query.status) params.set('status', query.status);
            if (query.partnerName) params.set('partnerName', query.partnerName);
            return ListPartnerReceiptsResponseSchema.parse(
              await request(`/partner-receipts?${params.toString()}`),
            );
          }

          export async function getPartnerReceipt(receiptId: string): Promise<GetPartnerReceiptResponse> {
            const params = PartnerReceiptParamsSchema.parse({ receiptId });
            return GetPartnerReceiptResponseSchema.parse(
              await request(`/partner-receipts/${encodeURIComponent(params.receiptId)}`),
            );
          }

          export async function createPartnerReceipt(
            input: CreatePartnerReceiptRequest,
          ): Promise<CreatePartnerReceiptResponse> {
            const body = CreatePartnerReceiptRequestSchema.parse(input);
            return CreatePartnerReceiptResponseSchema.parse(
              await request('/partner-receipts', { method: 'POST', body: JSON.stringify(body) }),
            );
          }
          ''')

          # These SQL files were present but absent from Drizzle's migration journal.
          # Keep every existing entry unchanged and append in chronological order.
          path = Path('packages/database/migrations/meta/_journal.json')
          journal = json.loads(path.read_text())
          if journal['entries'][-1]['tag'] != '0010_current_mens_product_name':
              raise SystemExit('Migration journal changed; review instead of overwriting')
          journal['entries'].extend([
              {'idx': 11, 'version': '7', 'when': 1790091197000, 'tag': '0011_add_wholesale_account_role', 'breakpoints': True},
              {'idx': 12, 'version': '7', 'when': 1790091197001, 'tag': '0012_add_partner_receipts', 'breakpoints': True},
          ])
          path.write_text(json.dumps(journal, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Format only changed and known failing files
        run: |
          ./node_modules/.bin/prettier --write apps/api/src/memory-repository.ts apps/api/src/postgres-repository.ts apps/web/src/lib/access.ts apps/web/src/lib/api.ts apps/web/src/features/partner-receipts/PartnerReceiptsPage.tsx apps/web/src/features/partner-receipts/partnerReceiptsApi.ts packages/database/src/partner-receipt-operations.ts packages/database/migrations/meta/_journal.json DEPLOYMENT.md DEPLOYMENT-SUMMARY.md
      - name: Validate formatting, lint, types, and production build
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run build
      - name: Publish only reviewed repairs to the isolated branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/chore/predeploy-wholesale-20260922
          git diff --check
          git add -- apps/api/src/memory-repository.ts apps/api/src/postgres-repository.ts apps/web/src/lib/access.ts apps/web/src/lib/api.ts apps/web/src/features/partner-receipts/PartnerReceiptsPage.tsx apps/web/src/features/partner-receipts/partnerReceiptsApi.ts packages/database/src/partner-receipt-operations.ts packages/database/migrations/meta/_journal.json DEPLOYMENT.md DEPLOYMENT-SUMMARY.md
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair pending partner receipts build and register database migrations'
          # No force-push: concurrent changes stop publication instead of being lost.
          git push origin HEAD:refs/heads/chore/predeploy-wholesale-20260922
          git log -1 --format='%H %s'
